<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09070d" />
    <meta name="description" content="Amira Gharbi — AI and mobile developer building thoughtful digital products." />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f7f5f8' : '#09070d');
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>Amira Gharbi — AI & Mobile Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { --glow-color: #a46bc7; }

      .sky-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        overflow: hidden;
        z-index: 0;
      }
      .cloud {
        position: absolute;
        background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 60%);
        border-radius: 50%;
        opacity: 0.5;
        animation: move-clouds linear infinite;
      }
      .cloud-1 { width: 400px; height: 400px; top: 20%; left: 10%; animation-duration: 120s; }
      .cloud-2 { width: 300px; height: 300px; top: 50%; left: 80%; animation-duration: 90s; }
      .cloud-3 { width: 500px; height: 500px; top: 70%; left: 30%; animation-duration: 150s; }

      @keyframes move-clouds {
        0% { transform: translateX(-100px) translateY(0); }
        50% { transform: translateX(100px) translateY(-30px); }
        100% { transform: translateX(-100px) translateY(0); }
      }

      .animated-gradient-text {
        background-size: 200% auto;
        animation: aurora 3s linear infinite;
      }

      @keyframes aurora {
        from { background-position: 0% 50%; }
        to { background-position: 100% 50%; }
      }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0c0a1a; }
      ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #a78bfa; }

      #cursor-dot, #cursor-outline {
        pointer-events: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s ease-in-out, transform 0.2s ease-in-out;
      }
      #cursor-dot { width: 8px; height: 8px; background-color: #a78bfa; }
      #cursor-outline { width: 40px; height: 40px; border: 2px solid #a78bfa; transition: width 0.3s ease, height 0.3s ease, border-width 0.3s ease, transform 0.2s ease; }
      body:hover #cursor-dot, body:hover #cursor-outline { opacity: 1; }

      .prose ul { list-style-type: disc; margin-left: 1.25rem; }
      .prose li { margin-top: 0.25rem; margin-bottom: 0.25rem; }
      .prose strong { font-weight: 600; }

    </style>
</head>
  <body>
    <div class="sky-background">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
    </div>
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
